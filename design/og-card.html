<!DOCTYPE html>
<!-- Source of assets/images/og-image.jpg, the 1200x630 link preview.
     Re-render after editing:  npm run og
     Uses the site's fonts and colours; the photo is the About portrait. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&display=block">
<style>
  @font-face { font-family: 'Nyght Serif'; src: url('../assets/fonts/NyghtSerif-Light.woff2') format('woff2'); font-weight: 300; font-style: normal; font-display: block; }
  @font-face { font-family: 'Nyght Serif'; src: url('../assets/fonts/NyghtSerif-LightItalic.woff2') format('woff2'); font-weight: 300; font-style: italic; font-display: block; }
  :root { --ink: #16130F; --accent: #FD3631; --rule: #D9D0BF; --cream: #FFFDF8; --bone: #F3EEE4; }
  html, body { margin: 0; }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: linear-gradient(180deg, var(--cream) 55%, var(--bone) 100%);
    color: var(--ink); font-family: 'Manrope', system-ui, sans-serif;
  }
  .logo { position: absolute; left: 72px; top: 66px; width: 110px; color: var(--accent); }
  .logo svg { display: block; width: 100%; height: auto; }
  .eyebrow {
    position: absolute; left: 72px; top: 199px;
    display: flex; align-items: center; gap: 14px;
    font: 600 18px/1 'Manrope', sans-serif; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .eyebrow::before { content: ""; width: 11px; height: 11px; border-radius: 999px; background: var(--accent); }
  h1 {
    position: absolute; left: 68px; top: 234px; margin: 0;
    font: 300 92px/0.94 'Nyght Serif', Georgia, serif; letter-spacing: -0.015em;
  }
  h1 em { font-style: italic; color: var(--accent); }
  .rule { position: absolute; left: 72px; top: 533px; width: 643px; height: 1px; background: var(--rule); }
  .url { position: absolute; left: 72px; top: 543px; font: 500 18px/1.2 'Manrope', sans-serif; }
  .photo {
    position: absolute; left: 788px; top: 56px; width: 340px; height: 518px;
    border-radius: 170px 170px 12px 12px; overflow: hidden;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 42% 28%; display: block; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><svg class="logo-mark" viewBox="0 0 1539 640" fill="currentColor" aria-hidden="true"><path d="M0 630V179A196.25 179 0 0 1 392.5 179V460A50.75 51 0 0 0 494 460V179A195.75 179 0 0 1 885.5 179V630H740V179A50.25 51 0 0 0 639.5 179V460A196.25 180 0 0 1 247 460V179A50.75 51 0 0 0 145.5 179V630Z"/><path fill-rule="evenodd" d="M987 10H1241A298 310 0 0 1 1241 630H987ZM1137 136H1229A160 184 0 0 1 1229 504H1137Z"/></svg></div>
    <div class="eyebrow">Maria Dopheide · Fractional COO</div>
    <h1><em>Operations</em> partner<br>for founders who<br><em>move</em> fast</h1>
    <div class="rule"></div>
    <div class="url">mariadopheide.com</div>
    <div class="photo"><img src="../assets/images/about-portrait.jpg" alt=""></div>
  </div>
</body>
</html>
